<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BusNova | Reservation Manager</title><style>:root{--navy:#101d38;--navy2:#1a2b4d;--orange:#ff8a29;--bg:#f4f7fc;--text:#192844}*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}aside{position:fixed;inset:0 auto 0 0;width:235px;background:var(--navy);color:white;padding:30px 18px}aside h2{margin:0 0 42px;font-size:25px}aside h2 span{color:var(--orange)}aside button{width:100%;text-align:left;border:0;background:none;color:#bdc9df;padding:16px;border-radius:12px;font-size:15px;cursor:pointer;margin-bottom:6px}aside button.active,aside button:hover{background:var(--navy2);color:white}main{margin-left:235px;padding:35px;max-width:1600px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px;gap:12px}h1{margin:0;font-size:28px}header p{color:#71809a;margin:6px 0}.pill{background:#fff0e3;color:#ba5710;padding:11px 15px;border-radius:20px;font-weight:700}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:24px}.stat,.panel{background:white;border-radius:18px;padding:24px;box-shadow:0 5px 28px #1a2b4d0a}.stat small{color:#77849b}.stat strong{display:block;font-size:31px;margin-top:13px}.stat:nth-child(2){border-top:4px solid var(--orange)}.stat:nth-child(1){border-top:4px solid #263f76}.stat:nth-child(3){border-top:4px solid #21aa87}.stat:nth-child(4){border-top:4px solid #6a70db}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap}.toolbar h2{margin:0}.btn{border:0;background:var(--orange);color:#fff;border-radius:10px;padding:12px 17px;font-weight:700;cursor:pointer}.btn.secondary{background:var(--navy2)}.btn.danger{background:#ef5865}.btn.small{padding:8px 11px;font-size:12px;margin-right:5px}input,select{border:1px solid #dfe5f0;padding:12px;border-radius:9px;width:100%;font:inherit;background:white}input:focus,select:focus{outline:2px solid #ffb779}#search{max-width:290px}table{width:100%;border-collapse:collapse;text-align:left}th{background:#f7f9fd;color:#75839a;font-size:12px;text-transform:uppercase}td,th{padding:14px;border-bottom:1px solid #edf0f5}td{font-size:14px}tr:hover td{background:#fbfcff}.tablewrap{overflow-x:auto}.muted{color:#8490a5}.tag{display:inline-block;background:#e9f7f0;color:#168d65;padding:6px 10px;border-radius:20px;font-size:12px}.hide{display:none!important}.modal{position:fixed;inset:0;background:#071227a8;display:flex;align-items:center;justify-content:center;padding:15px;z-index:5}.dialog{background:white;padding:28px;border-radius:18px;width:min(540px,100%);max-height:90vh;overflow:auto}.dialog h2{margin-top:0}.fields{display:grid;grid-template-columns:1fr 1fr;gap:13px}.fields label{font-size:13px;font-weight:700}.fields input,.fields select{margin-top:6px}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}.empty{text-align:center;color:#8490a5;padding:35px}.notice{padding:13px;background:#fff3e7;border-radius:10px;margin-bottom:20px;color:#99520e}@media(max-width:850px){aside{position:static;width:auto;padding:15px;display:flex;align-items:center;gap:10px;overflow:auto}aside h2{margin:0 15px 0 0;font-size:20px;white-space:nowrap}aside button{width:auto;white-space:nowrap;margin:0}main{margin:0;padding:18px}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.stats{grid-template-columns:1fr 1fr;gap:10px}.stat{padding:15px}.stat strong{font-size:23px}.fields{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}}</style></head><body><aside><h2>🚌 Bus<span>Nova</span></h2><button class="active" onclick="page('dashboard',this)">◫ Dashboard</button><button onclick="page('buses',this)">▤ Bus Management</button><button onclick="page('bookings',this)">▣ Reservations</button><button onclick="page('reports',this)">◷ Reports</button></aside><main><header><div><h1 id="title">Dashboard Overview</h1><p>Manage your fleet, passengers and reservations.</p></div><div class="pill">● Local System</div></header><div class="stats"><div class="stat"><small>Total Buses</small><strong id="sbus">0</strong></div><div class="stat"><small>Reservations</small><strong id="sbook">0</strong></div><div class="stat"><small>Available Seats</small><strong id="sseat">0</strong></div><div class="stat"><small>Total Revenue (NPR)</small><strong id="srev">0</strong></div></div><div class="panel"><div class="toolbar"><h2 id="heading">Recent Reservations</h2><input id="search" placeholder="Search records..." oninput="render()"><button class="btn" id="add" onclick="edit()">+ New Reservation</button></div><div id="extra"></div><div class="tablewrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div></div></main><div class="modal hide" id="modal"><div class="dialog"><h2 id="modalTitle"></h2><form id="form"><div class="fields" id="fields"></div><div class="actions"><button type="button" class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn">Save Record</button></div></form></div></div><script>let buses=[],bookings=[],view='dashboard',editing=0;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(path,data){let u=path+(data?'?'+new URLSearchParams(data):'');let r=await fetch(u);let j=await r.json();if(j.error)throw Error(j.error);return j}async function refresh(){try{[buses,bookings]=await Promise.all([api('/api/buses'),api('/api/bookings')]);render()}catch(e){alert('Connection failed: '+e.message)}}function page(v,el){view=v;document.querySelectorAll('aside button').forEach(b=>b.classList.remove('active'));el.classList.add('active');$('search').value='';render()}function bus(id){return buses.find(x=>x.id===id)}function render(){let revenue=bookings.reduce((n,x)=>n+(bus(x.bus)?.fare||0),0);$('sbus').textContent=buses.length;$('sbook').textContent=bookings.length;$('sseat').textContent=Math.max(0,buses.reduce((n,x)=>n+x.seats,0)-bookings.length);$('srev').textContent=revenue.toLocaleString();$('title').textContent=({dashboard:'Dashboard Overview',buses:'Bus Management',bookings:'Reservation Management',reports:'Reports & Analytics'})[view];$('heading').textContent=({dashboard:'Recent Reservations',buses:'Bus Fleet',bookings:'All Reservations',reports:'Booking Report'})[view];$('add').style.display=view==='reports'?'none':'';$('add').textContent=view==='buses'?'+ Add Bus':'+ New Reservation';$('extra').innerHTML=view==='reports'?'<div class="notice">Download a CSV report with passenger, bus, seat and fare details.</div><button class="btn" onclick="location.href=\'/api/report\'">↓ Export CSV Report</button><p></p>':'';let q=$('search').value.toLowerCase();let rows=view==='buses'?buses:bookings;rows=rows.filter(x=>JSON.stringify(x).toLowerCase().includes(q)||(bus(x.bus)?.name||'').toLowerCase().includes(q));if(view==='dashboard')rows=rows.slice(-8).reverse();$('thead').innerHTML=view==='buses'?'<tr><th>ID</th><th>Bus</th><th>Route</th><th>Departure</th><th>Seats</th><th>Fare</th><th>Actions</th></tr>':'<tr><th>Ticket</th><th>Passenger</th><th>Bus</th><th>Seat</th><th>Phone</th><th>Status</th><th>Actions</th></tr>';$('tbody').innerHTML=rows.map(x=>view==='buses'?`<tr><td>#${x.id}</td><td><b>${esc(x.name)}</b></td><td>${esc(x.from)} → ${esc(x.to)}</td><td>${esc(x.date)} ${esc(x.time)}</td><td>${x.seats}</td><td>Rs. ${x.fare}</td><td><button class="btn small secondary" onclick="edit(${x.id})">Edit</button><button class="btn small danger" onclick="removeRecord(${x.id})">Delete</button></td></tr>`:`<tr><td><b>#${x.id}</b></td><td>${esc(x.passenger)}</td><td>${esc(bus(x.bus)?.name||x.bus)}</td><td>${x.seat}</td><td>${esc(x.phone)}</td><td><span class="tag">Confirmed</span></td><td><button class="btn small secondary" onclick="edit(${x.id})">Edit</button><button class="btn small danger" onclick="removeRecord(${x.id})">Cancel</button></td></tr>`).join('')||'<tr><td colspan="7" class="empty">No matching records. Add your first record to get started.</td></tr>'}function field(label,name,type='text',value='',extra=''){return `<label>${label}<input name="${name}" type="${type}" value="${esc(value)}" ${extra} required></label>`}function edit(id=0){editing=id;let isBus=view==='buses',x=(isBus?buses:bookings).find(y=>y.id===id)||{};$('modalTitle').textContent=(id?'Update ':'Add ')+(isBus?'Bus':'Reservation');$('fields').innerHTML=isBus?field('Bus Name','name','text',x.name||'', 'maxlength="60"')+field('From','from','text',x.from||'','maxlength="60"')+field('To','to','text',x.to||'','maxlength="60"')+field('Departure Date','date','date',x.date||'')+field('Departure Time','time','time',x.time||'')+field('Seat Capacity','seats','number',x.seats||40,'min="1" max="100"')+field('Fare (NPR)','fare','number',x.fare??500,'min="0" step="0.01"'):`<label>Bus<select name="bus" required>${buses.map(b=>`<option value="${b.id}" ${b.id===x.bus?'selected':''}>${esc(b.name)} — ${esc(b.from)} to ${esc(b.to)}</option>`).join('')}</select></label>`+field('Seat Number','seat','number',x.seat||1,'min="1"')+field('Passenger Name','passenger','text',x.passenger||'','maxlength="75"')+field('Phone Number','phone','tel',x.phone||'','minlength="7" maxlength="20"');if(!isBus&&!buses.length){alert('Add a bus before creating reservations.');return}$('modal').classList.remove('hide')};function closeModal(){$('modal').classList.add('hide')}$('form').onsubmit=async e=>{e.preventDefault();let data=Object.fromEntries(new FormData(e.target));if(editing)data.id=editing;try{await api(view==='buses'?'/api/bus/save':'/api/booking/save',data);closeModal();refresh()}catch(err){alert(err.message)}};async function removeRecord(id){if(!confirm('Are you sure you want to delete this record?'))return;try{await api(view==='buses'?'/api/bus/delete':'/api/booking/delete',{id});refresh()}catch(err){alert(err.message)}}refresh();</script></body></html>
